# Batas memori disesuaikan dengan RAM mesin (8 GB) — 8G sebelumnya
# menyebabkan JVM crash (mmap failed / daemon hilang) saat build.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Disable Kotlin incremental compilation untuk mencegah error cache korup
kotlin.incremental=false
# Kotlin dikompilasi di dalam daemon Gradle (bukan daemon terpisah) —
# menghindari kegagalan koneksi daemon & mengurangi total memori JVM.
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx1536M
